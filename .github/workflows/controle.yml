# Controleert de gepubliceerde site: oude URL's, sitemap, securityheaders en redirects
# (livegang-checklist, MIGRATIE.md hoofdstuk 8). Alleen lezen, geen secrets.

name: Site controleren

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Welke site"
        type: choice
        options:
          - https://v2.brandweeruitgeest.nl
          - https://brandweeruitgeest.nl
        default: https://v2.brandweeruitgeest.nl

permissions:
  contents: read

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Controleren
        env:
          SITE: ${{ inputs.site }}
        run: |
          if [ "$SITE" = "https://brandweeruitgeest.nl" ]; then
            python tools/controleer_live.py "$SITE" --www
          else
            python tools/controleer_live.py "$SITE"
          fi
