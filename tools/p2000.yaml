# Instellingen voor tools/import_p2000.py (zie PLAN-P2000.md).
# Pas dit bestand aan als een melding niet herkend wordt; de code hoeft dan niet te veranderen.

# Alleen deze capcode telt als uitruk van brandweer Uitgeest (besluit Sven 28-09-2026).
capcode: "0107711"

# Maximaal aantal nieuwe P2000-uitrukken per dag. Daarboven stopt de import (bescherming
# tegen nepmeldingen of een storing die de site laat vollopen).
max_per_dag: 10

# Twee meldingen op dezelfde straat binnen zoveel minuten zijn dezelfde uitruk
# (herhaalalarm, opschaling).
zelfde_uitruk_minuten: 30

# Een ingetrokken alarmering telt als uitruk (besluit Sven 29-09-2026), het intrekbericht
# ("(Intrekken Alarm Brw)") is geen aparte uitruk. Intrekken gebeurt binnen een kwartier, dus
# het intrekbericht valt binnen dit venster en hoort bij dezelfde uitruk. Staat die er niet,
# dan komt de uitruk er één keer bij.

# Meldingen met een van deze woorden (hoofdletterongevoelig) worden overgeslagen.
overslaan:
  - proefalarm
  - testbericht
  - test alarm
  - oefening
  - contact mk

# Classificatie van de inzet, tussen haakjes vóór de melding: "(Middel BR)", "(Grote HV)",
# "(Zeer gr. BR)". Klein is de gewone inzet en krijgt geen toevoeging. Soorten: BR (brand),
# HV (hulpverlening), WO (waterongeval), IBGS (incidentbestrijding gevaarlijke stoffen).
#   brand:  "(Grote BR) BR woning" wordt "Grote brand woning", "(Grote BR) BR duin" wordt
#           "Duinbrand (grote brand)"
#   anders: "(Middel HV) HV weg" wordt "Hulpverlening weg (middel HV)", "(Grote WO)" wordt
#           "(groot WO)", "(Grote IBGS)" wordt "(groot IBGS)" (besluit Sven 29-09-2026)
# Volgt er geen herkende melding, dan wordt de melding "<soort> (<inzet> <code>)".
inzet:
  groottes:
    middel: {brand: Middelbrand, inzet: middel}
    groot: {brand: Grote brand, inzet: groot}
    zeer groot: {brand: Zeer grote brand, inzet: zeer groot}
  soorten:
    BR: Brand
    HV: Hulpverlening
    WO: Waterongeval
    IBGS: Ongeval gevaarlijke stof

# Groepen tussen haakjes vóór de melding (begin van de tekst binnen de haakjes, de langste
# wint). Volgt er een herkende melding, dan komt dit erachter: "(Pel. GW G3000 1) BR natuur"
# wordt "Natuurbrand (waterpeloton)". Anders is dit de melding: "(Basis pel.1) UGS
# Laboratoriumweg" wordt "Peloton". Pel. GW G3000 = peloton grootwatervoorziening 3000 m.
voorvoegsels:
  "Pel. GW": Waterpeloton
  "Pel GW": Waterpeloton
  "Basis pel": Peloton
  "Pel.": Peloton
  "Peloton": Peloton
  "Aflossing": Aflossing

# Begin van de melding in P2000 -> korte tekst op de site (zelfde stijl als de oude site).
# Hoofdletters maken niet uit; de langste passende tekst wint. Een melding die hier niet in
# staat en niet met "BR" begint, wordt niet gepubliceerd: de workflow faalt en laat de
# P2000-tekst zien. Voeg dan hier een regel toe en start de mislukte run opnieuw.
